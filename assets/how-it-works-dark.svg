<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" viewBox="0 0 1160 470" fill="none" role="img" aria-labelledby="ttl dsc"><title id="ttl">How the graphics are built</title><desc id="dsc">Pipeline: a GitHub token, four REST endpoints, six render functions in tools/build-assets.mjs, eleven SVG files written to assets/, and a picture element in README.md that picks the light or dark variant. No dependencies, no package.json.</desc><style>
text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;}
.t{fill:#E6EDF3;}
.s{fill:#8B949E;}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;}
.surf{fill:#0D1117;}
.panel{fill:#151B23;stroke:#30363D;}
.hair{stroke:#30363D;}
.grid{stroke:#21262D;}
.amber{fill:#F5B56B;}
.blue{fill:#79C0FF;}
.teal{fill:#7FD1C1;}
.plum{fill:#C3A6E8;}
.rose{fill:#F29D86;}
.arrow{stroke:#79C0FF;fill:#79C0FF;}
.arrow.rail{stroke:#30363D;fill:none;}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes flow{to{stroke-dashoffset:-44}}
@keyframes beat{0%,100%{opacity:.28;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect class="surf" width="1160" height="470" rx="14"/><text class="t" x="16" y="36" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start">One run rebuilds every graphic on this page</text><text class="s" x="16" y="60" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" text-anchor="start">gh auth token  →  api.github.com  →  tools/build-assets.mjs  →  assets/*.svg  →  README.md</text><text class="s" x="16" y="84" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="600" text-anchor="start">1 · AUTH</text><text class="s" x="248" y="84" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="600" text-anchor="start">2 · GITHUB API</text><text class="s" x="480" y="84" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="600" text-anchor="start">3 · THE SCRIPT</text><text class="s" x="712" y="84" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="600" text-anchor="start">4 · assets/</text><text class="s" x="944" y="84" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="600" text-anchor="start">5 · README.md</text><g class="rise" style="animation:rise .55s ease-out 0.0s both"><rect class="panel" x="16" y="96" width="200" height="300" rx="12"/><rect class="amber" x="16" y="96" width="200" height="3" rx="1.5"/><text class="amber" x="32" y="132" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="600" text-anchor="start">GH_TOKEN</text><text class="s" x="32" y="154" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">env var, or</text><text class="t" x="32" y="172" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" text-anchor="start">gh auth token</text><path class="grid" d="M32 196h168"/><text class="s" x="32" y="222" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">No token and the</text><text class="s" x="32" y="240" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">first fetch throws.</text><text class="s" x="32" y="276" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">Only non-fork repos</text><text class="s" x="32" y="294" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">of c0k0n are used,</text><text class="s" x="32" y="312" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">minus the profile</text><text class="s" x="32" y="330" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">repo itself.</text></g><g class="rise" style="animation:rise .55s ease-out 0.09s both"><rect class="panel" x="248" y="96" width="200" height="300" rx="12"/><rect class="blue" x="248" y="96" width="200" height="3" rx="1.5"/><text class="blue" x="264" y="132" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start">Four endpoints</text><text class="t" x="264" y="160" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" text-anchor="start">/users/c0k0n/repos</text><text class="t" x="264" y="184" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" text-anchor="start">/repos/*/commits</text><text class="t" x="264" y="208" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" text-anchor="start">/search/commits</text><text class="t" x="264" y="232" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" text-anchor="start">/repos/*/languages</text><path class="grid" d="M264 268h168"/><text class="s" x="264" y="292" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">Commit totals are</text><text class="s" x="264" y="310" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">read from the Link</text><text class="s" x="264" y="328" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">rel=last page,</text><text class="s" x="264" y="346" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">not by paging.</text></g><g class="rise" style="animation:rise .55s ease-out 0.18s both"><rect class="panel" x="480" y="96" width="200" height="300" rx="12"/><rect class="teal" x="480" y="96" width="200" height="3" rx="1.5"/><text class="teal" x="496" y="132" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start">333 lines · 0 deps</text><text class="t" x="496" y="160" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" text-anchor="start">header()</text><text class="t" x="496" y="183" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" text-anchor="start">tagline()</text><text class="t" x="496" y="206" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" text-anchor="start">stats()</text><text class="t" x="496" y="229" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" text-anchor="start">languages()</text><text class="t" x="496" y="252" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" text-anchor="start">commits()</text><text class="t" x="496" y="275" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" text-anchor="start">stack()</text><path class="grid" d="M496 314h168"/><text class="s" x="496" y="338" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">No package.json,</text><text class="s" x="496" y="356" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">no lockfile.</text></g><g class="rise" style="animation:rise .55s ease-out 0.27s both"><rect class="panel" x="712" y="96" width="200" height="300" rx="12"/><rect class="plum" x="712" y="96" width="200" height="3" rx="1.5"/><text class="plum" x="728" y="132" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start">11 files, all rewritten</text><text class="t" x="728" y="158" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" text-anchor="start">header.svg</text><text class="amber" x="896" y="158" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" text-anchor="end">×1</text><text class="t" x="728" y="181" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" text-anchor="start">tagline-*.svg</text><text class="blue" x="896" y="181" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" text-anchor="end">×2</text><text class="t" x="728" y="204" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" text-anchor="start">stats-*.svg</text><text class="teal" x="896" y="204" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" text-anchor="end">×2</text><text class="t" x="728" y="227" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" text-anchor="start">languages-*.svg</text><text class="plum" x="896" y="227" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" text-anchor="end">×2</text><text class="t" x="728" y="250" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" text-anchor="start">commits-*.svg</text><text class="rose" x="896" y="250" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" text-anchor="end">×2</text><text class="t" x="728" y="273" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" text-anchor="start">stack-*.svg</text><text class="blue" x="896" y="273" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" text-anchor="end">×2</text><path class="grid" d="M728 312h168"/><text class="s" x="728" y="336" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">Each of the 5 charts</text><text class="s" x="728" y="354" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">ships a -light and a</text><text class="s" x="728" y="372" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">-dark file.</text></g><g class="rise" style="animation:rise .55s ease-out 0.36s both"><rect class="panel" x="944" y="96" width="200" height="300" rx="12"/><rect class="rose" x="944" y="96" width="200" height="3" rx="1.5"/><text class="rose" x="960" y="132" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="600" text-anchor="start">&lt;picture&gt;</text><text class="s" x="960" y="160" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" text-anchor="start">prefers-color-scheme:</text><text class="t" x="960" y="178" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" text-anchor="start">dark  → -dark.svg</text><text class="t" x="960" y="196" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" text-anchor="start">light → -light.svg</text><path class="grid" d="M960 220h168"/><text class="s" x="960" y="244" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">Each theme gets its</text><text class="s" x="960" y="262" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">own file, so no CSS</text><text class="s" x="960" y="280" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">is needed and the</text><text class="s" x="960" y="298" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">numbers are readable</text><text class="s" x="960" y="316" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="start">in both.</text></g><g class="arrow" style="animation:none"><path d="M220 246.0h16" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5" style="animation:flow 1.1s linear infinite"/><path d="M237 241.0l7 5l-7 5z"/></g><g class="arrow" style="animation:none"><path d="M452 246.0h16" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5" style="animation:flow 1.1s linear infinite"/><path d="M469 241.0l7 5l-7 5z"/></g><g class="arrow" style="animation:none"><path d="M684 246.0h16" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5" style="animation:flow 1.1s linear infinite"/><path d="M701 241.0l7 5l-7 5z"/></g><g class="arrow" style="animation:none"><path d="M916 246.0h16" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5" style="animation:flow 1.1s linear infinite"/><path d="M933 241.0l7 5l-7 5z"/></g><rect class="panel" x="16" y="414" width="1128" height="36" rx="10"/><text class="s" x="580.0" y="437" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle">One run overwrites all 11 generated files — no number in this page is typed by hand.</text></svg>
