<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="572" viewBox="0 0 1040 572" fill="none" role="img" aria-labelledby="ttl dsc"><title id="ttl">File map</title><desc id="dsc">Repository tree: README.md and .gitignore are hand-maintained, tools/build-assets.mjs is the only code, and assets/ holds 13 SVGs of which 11 are rewritten by every run of the script and 2 are hand-drawn.</desc><style>
text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;}
.t{fill:#E6EDF3;}
.s{fill:#8B949E;}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;}
.surf{fill:#0D1117;}
.panel{fill:#151B23;stroke:#30363D;}
.hair{stroke:#30363D;}
.grid{stroke:#21262D;}
.amber{fill:#F5B56B;}
.blue{fill:#79C0FF;}
.teal{fill:#7FD1C1;}
.plum{fill:#C3A6E8;}
.rose{fill:#F29D86;}
.arrow{stroke:#79C0FF;fill:#79C0FF;}
.arrow.rail{stroke:#30363D;fill:none;}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes flow{to{stroke-dashoffset:-44}}
@keyframes beat{0%,100%{opacity:.28;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
